services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL_DOCKER:-http://host.docker.internal:55321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@host.docker.internal:55322/postgres}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8080/v1}
      AI_API_KEY: ${AI_API_KEY:-local}
      AI_MODEL: ${AI_MODEL:-Qwen3.8-27B-NVFP4}
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:55321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Server-side fetches inside the container use the Docker DNS name for the API
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

  otp:
    image: docker.io/opentripplanner/opentripplanner:2.8.1
    ports:
      - "8081:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx5g -Duser.language=ja -Duser.country=JP
    volumes:
      - ./otp:/var/opentripplanner
    command: --load --serve

volumes:
  web_node_modules:
